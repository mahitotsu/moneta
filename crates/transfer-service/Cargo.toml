[package]
name = "transfer-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "transfer_service"
path = "src/lib.rs"

# docs/adr/0010決定1: account-serviceのSQS FIFOキューへ直接SendMessageする(コマンドAPIは
# 経由しない)ため、account-serviceのようなAPI Gateway VTL関連の依存は不要。
# docs/adr/0008と同じ理由でaccount-service crate自体には依存しない(account-domainという
# ゼロ依存の契約型だけを共有する)。

[[bin]]
name = "transfer-command-intake"
path = "src/bin/command_intake.rs"

[[bin]]
name = "transfer-saga-step"
path = "src/bin/saga_step.rs"

[[bin]]
name = "transfer-owner-projector"
path = "src/bin/owner_projector.rs"

[[bin]]
name = "transfer-status-projector"
path = "src/bin/transfer_status_projector.rs"

[dependencies]
account-domain = { path = "../account-domain" }
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sdk-sqs = "1"
aws_lambda_events = "1.2.0"
lambda_runtime = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_dynamo = "4"
serde_json = { version = "1.0.151", features = ["std"] }
time = { version = "0.3", features = ["std"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-with-str"] }
rust_decimal_macros = "1"
