[package]
name = "fee-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "fee_service"
path = "src/lib.rs"

# docs/adr/0024決定1: fee-serviceは手数料ポリシー(金額決定ロジック、ポイント充当の可否判断)を
# 所有する。points-serviceを利用する(SQS/EventBridge越し)がCargoのコンパイル依存は持たない。
# account-domainにもaccount-serviceにも一切依存しない・一切話しかけない(現金負担分は
# transfer-service自身の既存のWithdraw/補償Depositに合算される、決定4)。

[[bin]]
name = "fee-command-intake"
path = "src/bin/command_intake.rs"

[[bin]]
name = "fee-points-observation"
path = "src/bin/points_observation.rs"

[[bin]]
name = "fee-outbox-projector"
path = "src/bin/outbox_projector.rs"

[dependencies]
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sdk-eventbridge = "1"
aws-sdk-sqs = "1"
aws-smithy-runtime-api = "1"
aws_lambda_events = "1.2.0"
lambda_runtime = "1.3.0"
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_dynamo = "4"
serde_json = { version = "1.0.151", features = ["std"] }
time = { version = "0.3", features = ["std", "serde-human-readable"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
rust_decimal_macros = "1"
