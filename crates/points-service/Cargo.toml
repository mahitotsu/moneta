[package]
name = "points-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "points_service"
path = "src/lib.rs"

# docs/adr/0024決定1: points-serviceは誰も知らない末端であり、account-domainにも
# fee-service/transfer-serviceにも依存しない。ポイント残高の増減という自分自身の関心事だけを
# 持つ、独立した境界づけられたコンテキスト(auth-serviceと同じ位置づけ)。

[[bin]]
name = "points-command-intake"
path = "src/bin/command_intake.rs"

[[bin]]
name = "points-outbox-projector"
path = "src/bin/outbox_projector.rs"

[dependencies]
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sdk-eventbridge = "1"
aws-smithy-runtime-api = "1"
aws_lambda_events = "1.2.0"
lambda_runtime = "1.3.0"
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_dynamo = "4"
serde_json = { version = "1.0.151", features = ["std"] }
time = { version = "0.3", features = ["std", "serde-human-readable"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
rust_decimal_macros = "1"
