[package]
name = "account-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "account_service"
path = "src/lib.rs"

[[bin]]
name = "account-service"
path = "src/main.rs"

[[bin]]
name = "account-outbox-relay"
path = "src/bin/outbox_relay.rs"

[[bin]]
name = "account-query-projector"
path = "src/bin/query_projector.rs"

[dependencies]
aurora-dsql-sqlx-connector = { version = "0.2.2", features = ["pool", "occ"] }
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sdk-eventbridge = "1"
aws_lambda_events = "1.2.0"
lambda_runtime = "1.3.0"
account-domain = { path = "../account-domain" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["std"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "uuid", "rust_decimal", "time", "json"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-with-str"] }
rust_decimal_macros = "1"
