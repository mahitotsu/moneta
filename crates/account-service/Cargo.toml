[package]
name = "account-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "account_service"
path = "src/lib.rs"

[[bin]]
name = "account-service"
path = "src/main.rs"

[[bin]]
name = "account-outbox-projector"
path = "src/bin/account_outbox_projector.rs"

[dependencies]
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sdk-eventbridge = "1"
aws-smithy-runtime-api = "1"
aws_lambda_events = { version = "1.2.0", features = ["dynamodb"] }
lambda_runtime = "1.3.0"
account-domain = { path = "../account-domain" }
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_dynamo = "4"
serde_json = { version = "1.0.151", features = ["std"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
aws-sdk-dynamodb = { version = "1", features = ["test-util"] }
aws-smithy-mocks = "0.3.0"
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-with-str"] }
rust_decimal_macros = "1"
