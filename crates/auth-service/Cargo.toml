[package]
name = "auth-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "auth_service"
path = "src/lib.rs"

[[bin]]
name = "auth-pre-signup"
path = "src/bin/pre_signup.rs"

[[bin]]
name = "auth-post-confirmation"
path = "src/bin/post_confirmation.rs"

[[bin]]
name = "auth-post-authentication"
path = "src/bin/post_authentication.rs"

[dependencies]
aws-config = "1"
aws-sdk-eventbridge = "1"
aws_lambda_events = { version = "1.2.0", features = ["cognito"] }
lambda_runtime = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["std"] }
time = { version = "0.3", features = ["std", "serde-human-readable"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1", features = ["v4", "serde"] }
