[package]
name = "query-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "query_service"
path = "src/lib.rs"

[[bin]]
name = "account-query-projector"
path = "src/bin/query_projector.rs"

[[bin]]
name = "account-number-projector"
path = "src/bin/account_number_projector.rs"

[[bin]]
name = "customer-accounts-projector"
path = "src/bin/customer_accounts_projector.rs"

[dependencies]
account-domain = { path = "../account-domain" }
aws-config = "1"
aws-sdk-dynamodb = "1"
aws_lambda_events = "1.2.0"
lambda_runtime = "1.3.0"
rand = "0.8"
serde_json = { version = "1.0.151", features = ["std"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-with-str"] }
rust_decimal_macros = "1"
